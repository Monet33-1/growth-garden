server.port=18080
spring.main.banner-mode=off

# Load user-editable desktop settings (for example the DeepSeek key).
spring.config.import=optional:file:${user.home}/.growth-garden/config/application-local.properties

spring.datasource.url=jdbc:h2:file:${user.home}/.growth-garden/data/growth_garden;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:db/desktop/schema.sql
spring.sql.init.data-locations=classpath:db/desktop/data.sql
spring.sql.init.continue-on-error=false

ai.deepseek.base-url=https://api.deepseek.com
ai.deepseek.model=deepseek-chat

# The single local desktop account may manage its own hidden letters.
app.desktop.user-admin=true

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
