server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

ai.deepseek.api-key=${DEEPSEEK_API_KEY}
ai.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
ai.deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}

jwt.secret=${JWT_SECRET}

app.admin.username=${ADMIN_USERNAME}
app.admin.password-salt=${ADMIN_PASSWORD_SALT}
app.admin.password-hash=${ADMIN_PASSWORD_HASH}
app.admin.password-iterations=${ADMIN_PASSWORD_ITERATIONS:200000}

# Do not print SQL parameters (diary content) in production logs.
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
