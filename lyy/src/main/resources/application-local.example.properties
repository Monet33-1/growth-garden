# Copy this file to application-local.properties and fill in local values.
# Never commit application-local.properties.

spring.datasource.password=YOUR_DB_PASSWORD

# DeepSeek AI
ai.deepseek.api-key=YOUR_DEEPSEEK_API_KEY
ai.deepseek.base-url=https://api.deepseek.com
ai.deepseek.model=deepseek-chat

# JWT signing secret, at least 32 bytes
jwt.secret=CHANGE_ME_TO_A_RANDOM_SECRET_OF_AT_LEAST_32_BYTES

# Administrator credentials for /admin/letters
app.admin.username=CHANGE_ME
app.admin.password-salt=CHANGE_ME_BASE64_SALT
app.admin.password-hash=CHANGE_ME_BASE64_HASH
app.admin.password-iterations=200000
